# Enterprise RAG Intelligence Platform
#
#   Infrastructure only (local development):   docker compose up -d postgres redis
#   Full stack (API + Postgres + Redis):        docker compose up -d --build
#
# Host ports are deliberately non-default (5442, 6380, 8001) so the stack can
# coexist with other local Postgres/Redis/API instances. The API UI is Swagger at
# http://localhost:8001/api/v1/docs (this AI-focused build ships no web frontend).

name: enterprise-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-rag_platform}
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAILS: '["shivaji@example.com"]'
      STORAGE_DIR: /data/storage
      HF_HOME: /data/hf_cache
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - uploads:/data/storage
      - hf_cache:/data/hf_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      # First start downloads the models (~180 MB) into the hf_cache volume.
      start_period: 300s

volumes:
  pgdata:
  redisdata:
  uploads:
  hf_cache:
